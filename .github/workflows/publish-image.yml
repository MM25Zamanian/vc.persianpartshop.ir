name: Publish GHCR image

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/**'
      - 'lib/**'
      - 'public/**'
      - 'nginx/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '*config.*'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

# Only the newest main commit needs an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Lint, Next.js build and its TypeScript check run once inside Docker.
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha,version=2,scope=ic-card-amd64
          cache-to: type=gha,version=2,scope=ic-card-amd64,mode=max,ignore-error=true
          provenance: false
          sbom: false
